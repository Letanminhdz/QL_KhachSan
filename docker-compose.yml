version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: qlkhachsan_db
    restart: always
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: ql_khachsan
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  backend:
    image: php:8.4-fpm
    container_name: qlkhachsan_backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    # Cài đặt thêm các extension pdo_mysql cần thiết cho Laravel
    command: >
      sh -c "apt-get update && apt-get install -y libzip-dev zip unzip
      && docker-php-ext-install pdo_mysql zip
      && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    image: node:20-alpine
    container_name: qlkhachsan_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  db_data:
